version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:YOUR_PASSWORD@db.YOUR_SUPABASE_REF.supabase.co:5432/postgres
      - SUPABASE_URL=https://YOUR_SUPABASE_REF.supabase.co
      - SUPABASE_KEY=YOUR_SUPABASE_ANON_KEY
      - JWT_SECRET_KEY=YOUR_STRONG_SECRET_KEY
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    depends_on:
      - db # If you decide to run a local database

  # Uncomment and configure if you want a local PostgreSQL database
  # db:
  #   image: postgres:13
  #   environment:
  #     POSTGRES_DB: postgres
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: password
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - db_data:/var/lib/postgresql/data

# volumes:
#   db_data:
